name: Build Docker Images

on:
  push:
    paths:
      - "docker-images/**"
      - "templates/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "docker-images/**"
      - "templates/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  DOCKER: jrottenberg/ffmpeg
  GHCR: ghcr.io/jrottenberg/ffmpeg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pre-commit packaging
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      manifest: ${{ steps.matrix.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          full_build=$(jq -c '.build' docker-images/github-actions-matrix.json)
          full_manifest=$(jq -c '.manifest' docker-images/github-actions-matrix.json)

          emit_all() {
            echo "Selecting ALL versions"
            {
              echo "build=$full_build"
              echo "manifest=$full_manifest"
            } >> "$GITHUB_OUTPUT"
          }

          # Only build versions whose image files changed. Anything we cannot
          # reliably diff (manual dispatch, new branch, missing base) falls back
          # to building everything so we never accidentally skip a needed image.
          case "$EVENT_NAME" in
            pull_request)
              base="$BASE_SHA"
              ;;
            push)
              if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
                base="$BEFORE_SHA"
              else
                # Feature branch: compare against the default branch so we build
                # only what this branch changes relative to it.
                git fetch --no-tags --quiet origin "$DEFAULT_BRANCH" || true
                base="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || true)"
              fi
              ;;
            *)
              emit_all; exit 0
              ;;
          esac

          if [ -z "${base:-}" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            emit_all; exit 0
          fi

          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"; echo "$changed"

          # A change to the workflow itself or a shared template rebuilds
          # everything, since those affect every generated image.
          if echo "$changed" | grep -qE '^\.github/workflows/build\.yml$|^templates/'; then
            emit_all; exit 0
          fi

          # Otherwise, restrict the matrix to the changed version directories.
          versions="$(echo "$changed" \
            | sed -nE 's#^docker-images/([0-9]+\.[0-9]+)/.*#\1#p' \
            | sort -u)"
          echo "Changed versions: ${versions:-<none>}"

          if [ -z "$versions" ]; then
            {
              echo "build=[]"
              echo "manifest=[]"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selected="$(printf '%s\n' $versions | jq -R . | jq -sc .)"
          filter='[.[] | select(.version as $v | $sel | index($v))]'
          filtered_build="$(echo "$full_build" | jq -c --argjson sel "$selected" "$filter")"
          filtered_manifest="$(echo "$full_manifest" | jq -c --argjson sel "$selected" "$filter")"
          {
            echo "build=$filtered_build"
            echo "manifest=$filtered_manifest"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, generate-matrix]
    if: needs.generate-matrix.outputs.build != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Cap concurrent legs so we don't hammer Docker Hub with dozens of
      # simultaneous pushes to the same repo (that's what trips its 429
      # rate limiting, separate from the base-image *pull* limiting we
      # already moved off Docker Hub for).
      max-parallel: 6
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker.io intermittently 429s the push side under matrix-wide load
      # (a separate issue from the base-image *pull* limiting fixed
      # earlier). docker/build-push-action has no built-in retry (declined
      # upstream: https://github.com/docker/build-push-action/pull/1422),
      # so we retry the step itself up to 3 times with backoff. The build
      # stages are cached via type=gha, so a retry mostly just re-attempts
      # the push, not a full rebuild.
      - name: Build and push (attempt 1)
        id: build_push_1
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: docker-images/${{ matrix.version }}/${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER }}:${{ matrix.long_version }}-${{ matrix.variant }}-${{ matrix.arch }}
            ${{ env.GHCR }}:${{ matrix.long_version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Wait before retrying push (attempt 2)
        if: steps.build_push_1.outcome == 'failure'
        run: sleep 30
      - name: Build and push (attempt 2)
        id: build_push_2
        if: steps.build_push_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: docker-images/${{ matrix.version }}/${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER }}:${{ matrix.long_version }}-${{ matrix.variant }}-${{ matrix.arch }}
            ${{ env.GHCR }}:${{ matrix.long_version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Wait before retrying push (attempt 3)
        if: steps.build_push_1.outcome == 'failure' && steps.build_push_2.outcome == 'failure'
        run: sleep 60
      - name: Build and push (attempt 3)
        if: steps.build_push_1.outcome == 'failure' && steps.build_push_2.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: docker-images/${{ matrix.version }}/${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER }}:${{ matrix.long_version }}-${{ matrix.variant }}-${{ matrix.arch }}
            ${{ env.GHCR }}:${{ matrix.long_version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Load image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: docker-images/${{ matrix.version }}/${{ matrix.variant }}
          load: true
          tags: smoke-test:latest
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Smoke test
        run: |
          docker run --rm smoke-test:latest -version
          docker run --rm smoke-test:latest -buildconf
          CODECS=$(docker run --rm smoke-test:latest -codecs)
          for codec in libx264 libx265 libvpx libopus; do
            echo "Checking $codec..."
            echo "$CODECS" | grep -q "$codec" || { echo "MISSING: $codec"; exit 1; }
          done
          echo "All codec checks passed"

  create-manifests:
    if: github.event_name == 'push' && needs.generate-matrix.outputs.manifest != '[]'
    needs: [build, generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same reasoning as the build job: avoid a burst of concurrent
      # `imagetools create` pushes against docker.io tripping its rate
      # limiting.
      max-parallel: 6
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.manifest) }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        env:
          PLATFORMS: ${{ matrix.platforms }}
          VARIANT: ${{ matrix.variant }}
          PARENT: ${{ matrix.parent }}
          VERSION: ${{ matrix.version }}
          LONG_VERSION: ${{ matrix.long_version }}
          MAJOR_VERSION: ${{ matrix.major_version }}
          ISPARENT: ${{ matrix.is_parent }}
          ISLATEST: ${{ matrix.is_latest }}
        run: |
          # docker.io intermittently 429s these registry writes under load;
          # retry with backoff instead of failing the whole job on a
          # transient rate limit.
          retry() {
            local max_attempts=5 delay=15 attempt=1
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt} failed, retrying in ${delay}s: $*" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          DOCKER_SOURCES=""
          GHCR_SOURCES=""
          IFS=',' read -ra ARCHS <<< "${PLATFORMS}"
          for platform in "${ARCHS[@]}"; do
            arch="${platform#linux/}"
            DOCKER_SOURCES="${DOCKER_SOURCES} ${{ env.DOCKER }}:${LONG_VERSION}-${VARIANT}-${arch}"
            GHCR_SOURCES="${GHCR_SOURCES} ${{ env.GHCR }}:${LONG_VERSION}-${VARIANT}-${arch}"
          done

          DOCKER_TAGS="${{ env.DOCKER }}:${VERSION}-${VARIANT} ${{ env.DOCKER }}:${LONG_VERSION}-${VARIANT}"
          GHCR_TAGS="${{ env.GHCR }}/${VERSION}-${VARIANT} ${{ env.GHCR }}/${LONG_VERSION}-${VARIANT}"

          if [ "${ISPARENT}" == "True" ] && [ "${VARIANT}" != "${PARENT}" ]; then
            DOCKER_TAGS="${DOCKER_TAGS} ${{ env.DOCKER }}:${VERSION}-${PARENT} ${{ env.DOCKER }}:${MAJOR_VERSION}-${PARENT}"
            GHCR_TAGS="${GHCR_TAGS} ${{ env.GHCR }}:${VERSION}-${PARENT} ${{ env.GHCR }}:${MAJOR_VERSION}-${PARENT}"
          fi

          if [ "${ISLATEST}" == "True" ]; then
            DOCKER_TAGS="${DOCKER_TAGS} ${{ env.DOCKER }}:latest"
            GHCR_TAGS="${GHCR_TAGS} ${{ env.GHCR }}:latest"
          fi

          for tag in ${DOCKER_TAGS}; do
            retry docker buildx imagetools create -t "${tag}" ${DOCKER_SOURCES}
          done
          for tag in ${GHCR_TAGS}; do
            retry docker buildx imagetools create -t "${tag}" ${GHCR_SOURCES}
          done

  build-docs:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync README and CONTRIBUTING to docs
        run: |
          mkdir -p docs
          printf -- '---\nlayout: default\ntitle: FFmpeg Docker Images\n---\n\n' > docs/index.md
          cat README.md >> docs/index.md
          printf -- '---\nlayout: default\ntitle: Contributing\n---\n\n' > docs/contributing.md
          cat CONTRIBUTING.md >> docs/contributing.md
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
