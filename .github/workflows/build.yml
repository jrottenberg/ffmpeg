name: Build Docker Images

on:
  push:
    paths:
      - "docker-images/**"
      - "templates/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "docker-images/**"
      - "templates/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

env:
  DOCKER: jrottenberg/ffmpeg
  GHCR: ghcr.io/jrottenberg/ffmpeg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: pip install pre-commit packaging
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      manifest: ${{ steps.matrix.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          full_build=$(jq -c '.build' docker-images/github-actions-matrix.json)
          full_manifest=$(jq -c '.manifest' docker-images/github-actions-matrix.json)

          emit_all() {
            echo "Selecting ALL versions"
            {
              echo "build=$full_build"
              echo "manifest=$full_manifest"
            } >> "$GITHUB_OUTPUT"
          }

          # Only build versions whose image files changed. Anything we cannot
          # reliably diff (manual dispatch, new branch, missing base) falls back
          # to building everything so we never accidentally skip a needed image.
          case "$EVENT_NAME" in
            pull_request)
              base="$BASE_SHA"
              ;;
            push)
              if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
                base="$BEFORE_SHA"
              else
                # Feature branch: compare against the default branch so we build
                # only what this branch changes relative to it.
                git fetch --no-tags --quiet origin "$DEFAULT_BRANCH" || true
                base="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || true)"
              fi
              ;;
            *)
              emit_all; exit 0
              ;;
          esac

          if [ -z "${base:-}" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            emit_all; exit 0
          fi

          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"; echo "$changed"

          # A change to the workflow itself or a shared template rebuilds
          # everything, since those affect every generated image.
          if echo "$changed" | grep -qE '^\.github/workflows/build\.yml$|^templates/'; then
            emit_all; exit 0
          fi

          # Otherwise, restrict the matrix to the changed version directories.
          versions="$(echo "$changed" \
            | sed -nE 's#^docker-images/([0-9]+\.[0-9]+)/.*#\1#p' \
            | sort -u)"
          echo "Changed versions: ${versions:-<none>}"

          if [ -z "$versions" ]; then
            {
              echo "build=[]"
              echo "manifest=[]"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selected="$(printf '%s\n' $versions | jq -R . | jq -sc .)"
          filter='[.[] | select(.version as $v | $sel | index($v))]'
          filtered_build="$(echo "$full_build" | jq -c --argjson sel "$selected" "$filter")"
          filtered_manifest="$(echo "$full_manifest" | jq -c --argjson sel "$selected" "$filter")"
          {
            echo "build=$filtered_build"
            echo "manifest=$filtered_manifest"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [lint, generate-matrix]
    if: needs.generate-matrix.outputs.build != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Cap concurrent legs so we don't hammer Docker Hub with dozens of
      # simultaneous pushes to the same repo (that's what trips its 429
      # rate limiting, separate from the base-image *pull* limiting we
      # already moved off Docker Hub for).
      max-parallel: 6
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # No docker.io login needed here: this job only pushes the
      # per-arch staging tags to ghcr.io (see below).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # These per-arch tags are internal staging artifacts consumed only by
      # the create-manifests job below (they're not documented/published
      # tags anyone pulls directly), so push them to ghcr.io only. ghcr.io
      # has no meaningful rate limit; docker.io does, and with up to ~30
      # of these legs running per pipeline run, pushing every per-arch
      # image there too was a major source of its 429s. The final,
      # user-facing multi-arch tags (e.g. jrottenberg/ffmpeg:9.0-alpine320)
      # still get published to docker.io by create-manifests, just
      # assembled from these ghcr.io sources instead of docker.io ones.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker-images/${{ matrix.version }}/${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.GHCR }}:${{ matrix.long_version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Load image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker-images/${{ matrix.version }}/${{ matrix.variant }}
          load: true
          tags: smoke-test:latest
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
      - name: Smoke test
        run: |
          docker run --rm smoke-test:latest -version
          docker run --rm smoke-test:latest -buildconf
          CODECS=$(docker run --rm smoke-test:latest -codecs)
          for codec in libx264 libx265 libvpx libopus; do
            echo "Checking $codec..."
            echo "$CODECS" | grep -q "$codec" || { echo "MISSING: $codec"; exit 1; }
          done
          echo "All codec checks passed"

  create-manifests:
    if: github.event_name == 'push' && needs.generate-matrix.outputs.manifest != '[]'
    needs: [build, generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same reasoning as the build job: avoid a burst of concurrent
      # `imagetools create` pushes against docker.io tripping its rate
      # limiting.
      max-parallel: 6
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.manifest) }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        env:
          PLATFORMS: ${{ matrix.platforms }}
          VARIANT: ${{ matrix.variant }}
          PARENT: ${{ matrix.parent }}
          VERSION: ${{ matrix.version }}
          LONG_VERSION: ${{ matrix.long_version }}
          MAJOR_VERSION: ${{ matrix.major_version }}
          ISPARENT: ${{ matrix.is_parent }}
          ISLATEST: ${{ matrix.is_latest }}
        run: |
          # docker.io intermittently 429s these registry writes under load;
          # retry with backoff instead of failing the whole job on a
          # transient rate limit.
          retry() {
            local max_attempts=5 delay=15 attempt=1
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt} failed, retrying in ${delay}s: $*" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # The build job only stages per-arch images on ghcr.io (see that
          # job for why), so that's the only source we ever read from here.
          # `imagetools create` can assemble a manifest list on one
          # registry from sources hosted on a different one, so this is
          # enough to publish the final tags on both docker.io and ghcr.io.
          SOURCES=""
          IFS=',' read -ra ARCHS <<< "${PLATFORMS}"
          for platform in "${ARCHS[@]}"; do
            arch="${platform#linux/}"
            SOURCES="${SOURCES} ${{ env.GHCR }}:${LONG_VERSION}-${VARIANT}-${arch}"
          done

          DOCKER_TAGS="${{ env.DOCKER }}:${VERSION}-${VARIANT} ${{ env.DOCKER }}:${LONG_VERSION}-${VARIANT}"
          GHCR_TAGS="${{ env.GHCR }}:${VERSION}-${VARIANT} ${{ env.GHCR }}:${LONG_VERSION}-${VARIANT}"

          if [ "${ISPARENT}" == "True" ] && [ "${VARIANT}" != "${PARENT}" ]; then
            DOCKER_TAGS="${DOCKER_TAGS} ${{ env.DOCKER }}:${VERSION}-${PARENT} ${{ env.DOCKER }}:${MAJOR_VERSION}-${PARENT}"
            GHCR_TAGS="${GHCR_TAGS} ${{ env.GHCR }}:${VERSION}-${PARENT} ${{ env.GHCR }}:${MAJOR_VERSION}-${PARENT}"
          fi

          if [ "${ISLATEST}" == "True" ]; then
            DOCKER_TAGS="${DOCKER_TAGS} ${{ env.DOCKER }}:latest"
            GHCR_TAGS="${GHCR_TAGS} ${{ env.GHCR }}:latest"
          fi

          # ghcr.io first: it's not rate-limited, so this should always
          # succeed and guarantees the ghcr.io tags are published even if
          # docker.io below is throttled.
          for tag in ${GHCR_TAGS}; do
            retry docker buildx imagetools create -t "${tag}" ${SOURCES}
          done
          for tag in ${DOCKER_TAGS}; do
            retry docker buildx imagetools create -t "${tag}" ${SOURCES}
          done

  build-docs:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sync README and CONTRIBUTING to docs
        run: |
          mkdir -p docs
          printf -- '---\nlayout: default\ntitle: FFmpeg Docker Images\n---\n\n' > docs/index.md
          cat README.md >> docs/index.md
          printf -- '---\nlayout: default\ntitle: Contributing\n---\n\n' > docs/contributing.md
          cat CONTRIBUTING.md >> docs/contributing.md
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
